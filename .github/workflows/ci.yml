name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Build workspace
        run: pnpm build
      - name: Unit and HTTP component tests
        run: pnpm test
      - name: Validate development Compose
        run: pnpm docker:config
      - name: Orders and payment tests with PostgreSQL
        run: pnpm test:orders
      - name: Charges tests with PostgreSQL
        run: pnpm test:charges
      - name: End-to-end tests with real services and PostgreSQL
        run: pnpm test:e2e
      - name: Duplicate-charge scenario and persisted evidence
        run: pnpm test:scenario
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7
